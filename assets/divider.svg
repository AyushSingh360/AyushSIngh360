<svg xmlns="http://www.w3.org/2000/svg" width="600" height="20" viewBox="0 0 600 20">
  <style>
    @keyframes shimmerLine { 0% { opacity: 0.2; } 50% { opacity: 0.8; } 100% { opacity: 0.2; } }
    @keyframes pulse { 0%, 100% { r: 2; opacity: 0.4; } 50% { r: 3.5; opacity: 1; } }
    .line-left { stroke: url(#divGradLeft); stroke-width: 0.8; }
    .line-right { stroke: url(#divGradRight); stroke-width: 0.8; }
    .center-diamond { fill: #C4A24E; animation: shimmerLine 2.5s ease-in-out infinite; }
    .dot { fill: #C4A24E; animation: pulse 2s ease-in-out infinite; }
    .dot-left { animation-delay: 0.3s; }
    .dot-right { animation-delay: 0.6s; }
  </style>
  <defs>
    <linearGradient id="divGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4A24E;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#C4A24E;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4A24E;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C4A24E;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Left line -->
  <line x1="100" y1="10" x2="280" y2="10" class="line-left" />
  <!-- Center diamond -->
  <polygon points="296,10 300,5 304,10 300,15" class="center-diamond" />
  <!-- Right line -->
  <line x1="320" y1="10" x2="500" y2="10" class="line-right" />
  <!-- Pulsing dots -->
  <circle cx="285" cy="10" r="2" class="dot dot-left" />
  <circle cx="315" cy="10" r="2" class="dot dot-right" />
</svg>
