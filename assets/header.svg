<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#C4A24E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111116;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes shimmer { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }
    @keyframes dash { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { r: 1.5; opacity: 0.3; } 50% { r: 3; opacity: 0.8; } }

    .name { font-family: 'Segoe UI', Tahoma, sans-serif; fill: url(#goldGrad); font-size: 56px; font-weight: 700; letter-spacing: 8px; filter: url(#softGlow); animation: fadeIn 1.5s ease-out; }
    .tagline { font-family: 'Segoe UI', Tahoma, sans-serif; fill: #6A6560; font-size: 14px; letter-spacing: 8px; animation: fadeIn 2s ease-out 0.5s both; }
    .decorator { stroke: #C4A24E; stroke-width: 1; fill: none; opacity: 0.4; }
    .star { fill: #C4A24E; animation: shimmer 3s ease-in-out infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.5s; }
    .s3 { animation-delay: 1s; }
    .s4 { animation-delay: 1.5s; }
    .s5 { animation-delay: 2s; }
    .s6 { animation-delay: 0.3s; }
    .line-anim { stroke: #C4A24E; stroke-width: 0.5; opacity: 0.3; stroke-dasharray: 200; stroke-dashoffset: 200; animation: dash 2s ease-out forwards; }
    .line-anim2 { animation-delay: 0.5s; }
    .particle { animation: pulse 2.5s ease-in-out infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 0.8s; }
    .p3 { animation-delay: 1.6s; }
    .p4 { animation-delay: 0.4s; }
    .p5 { animation-delay: 1.2s; }
  </style>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="8" />

  <!-- Decorative corner elements -->
  <path d="M 30 30 L 30 10 L 50 10" class="decorator" />
  <path d="M 770 30 L 770 10 L 750 10" class="decorator" />
  <path d="M 30 170 L 30 190 L 50 190" class="decorator" />
  <path d="M 770 170 L 770 190 L 750 190" class="decorator" />

  <!-- Animated decorative lines -->
  <line x1="120" y1="100" x2="280" y2="100" class="line-anim" />
  <line x1="520" y1="100" x2="680" y2="100" class="line-anim line-anim2" />

  <!-- Floating particles -->
  <circle cx="100" cy="50" r="1.5" fill="#C4A24E" class="particle p1" />
  <circle cx="700" cy="60" r="1.5" fill="#C4A24E" class="particle p2" />
  <circle cx="150" cy="150" r="1.5" fill="#C4A24E" class="particle p3" />
  <circle cx="650" cy="140" r="1.5" fill="#C4A24E" class="particle p4" />
  <circle cx="400" cy="30" r="1.5" fill="#C4A24E" class="particle p5" />

  <!-- Shimmer stars -->
  <circle cx="200" cy="40" r="1" class="star s1" />
  <circle cx="600" cy="45" r="1" class="star s2" />
  <circle cx="350" cy="170" r="1" class="star s3" />
  <circle cx="500" cy="35" r="1" class="star s4" />
  <circle cx="130" cy="130" r="1" class="star s5" />
  <circle cx="680" cy="160" r="1" class="star s6" />

  <!-- Main Name -->
  <text x="400" y="105" text-anchor="middle" class="name">AYUSH SINGH</text>

  <!-- Tagline -->
  <text x="400" y="145" text-anchor="middle" class="tagline">FULL-STACK  ·  AI/ML  ·  CREATIVE DEV</text>

  <!-- Diamond decorators around tagline -->
  <polygon points="270,140 274,136 278,140 274,144" fill="#C4A24E" opacity="0.4" />
  <polygon points="522,140 526,136 530,140 526,144" fill="#C4A24E" opacity="0.4" />
</svg>
