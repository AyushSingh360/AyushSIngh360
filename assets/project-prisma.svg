<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0F" />
      <stop offset="100%" style="stop-color:#12121A" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF" />
      <stop offset="100%" style="stop-color:#A78BFA" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes orbit { 0% { transform: rotate(0deg) translateX(18px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(18px) rotate(-360deg); } }
    .card-bg { fill: url(#bg1); stroke: #1E1E28; stroke-width: 1; }
    .title { font-family: 'Segoe UI', sans-serif; fill: #C4A24E; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .desc { font-family: 'Segoe UI', sans-serif; fill: #9A9590; font-size: 11.5px; line-height: 1.4; }
    .tag { font-family: 'JetBrains Mono', monospace; fill: #7B61FF; font-size: 9px; letter-spacing: 1px; }
    .tag-bg { fill: #7B61FF; opacity: 0.1; }
    .lang-dot { fill: #3572A5; }
    .lang { font-family: 'Segoe UI', sans-serif; fill: #6A6560; font-size: 10px; }
    .star { font-family: 'Segoe UI', sans-serif; fill: #C4A24E; font-size: 10px; }
    .icon-main { animation: float 3s ease-in-out infinite; }
    .particle { fill: #7B61FF; animation: pulse 2.5s ease-in-out infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 0.6s; }
    .p3 { animation-delay: 1.2s; }
  </style>

  <!-- Card -->
  <rect width="380" height="220" rx="12" class="card-bg" />

  <!-- Accent line top -->
  <rect x="24" y="0" width="60" height="2" rx="1" fill="url(#accent1)" />

  <!-- Icon — Neural network / Agent nodes -->
  <g class="icon-main" transform="translate(330, 40)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#7B61FF" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#7B61FF" stroke-width="0.5" opacity="0.3" />
    <circle cx="0" cy="0" r="4" fill="#7B61FF" opacity="0.8" filter="url(#glow1)" />
    <circle cx="14" cy="-8" r="2.5" fill="#A78BFA" opacity="0.7" />
    <circle cx="-12" cy="10" r="2.5" fill="#A78BFA" opacity="0.7" />
    <circle cx="8" cy="14" r="2.5" fill="#A78BFA" opacity="0.7" />
    <line x1="0" y1="0" x2="14" y2="-8" stroke="#7B61FF" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="0" x2="-12" y2="10" stroke="#7B61FF" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="0" x2="8" y2="14" stroke="#7B61FF" stroke-width="0.5" opacity="0.4" />
  </g>

  <!-- Particles -->
  <circle cx="300" cy="80" r="1" class="particle p1" />
  <circle cx="350" cy="70" r="1" class="particle p2" />
  <circle cx="320" cy="55" r="1" class="particle p3" />

  <!-- Title -->
  <text x="24" y="40" class="title">PRISMA AGENT</text>

  <!-- Description -->
  <text x="24" y="65" class="desc">
    <tspan x="24" dy="0">Multi-agent coding assistant powered by a supervisor</tspan>
    <tspan x="24" dy="16">agent that parallelizes natural-language coding tasks</tspan>
    <tspan x="24" dy="16">across specialized sub-agents, then synthesizes results</tspan>
    <tspan x="24" dy="16">into a unified response.</tspan>
  </text>

  <!-- Tags -->
  <rect x="24" y="140" width="60" height="18" rx="9" class="tag-bg" />
  <text x="54" y="153" text-anchor="middle" class="tag">AI AGENT</text>

  <rect x="92" y="140" width="82" height="18" rx="9" class="tag-bg" />
  <text x="133" y="153" text-anchor="middle" class="tag">MULTI-AGENT</text>

  <rect x="182" y="140" width="35" height="18" rx="9" class="tag-bg" />
  <text x="200" y="153" text-anchor="middle" class="tag">CLI</text>

  <rect x="225" y="140" width="44" height="18" rx="9" class="tag-bg" />
  <text x="247" y="153" text-anchor="middle" class="tag">LLM</text>

  <!-- Footer -->
  <line x1="24" y1="178" x2="356" y2="178" stroke="#1E1E28" stroke-width="0.5" />

  <!-- Language -->
  <circle cx="30" cy="198" r="4" class="lang-dot" />
  <text x="40" y="202" class="lang">Python</text>

  <!-- Stars -->
  <text x="320" y="202" class="star">★ 1</text>

  <!-- View arrow -->
  <text x="348" y="202" font-family="'Segoe UI', sans-serif" fill="#C4A24E" font-size="12" opacity="0.6">→</text>
</svg>
